rules:
  - id: admin_login_ip
    match:
      methods: [POST]
      paths: [/api/admin/login]
    # NOTE: capacity == burst (see RateLimitBucket.capacity). burst is the number
    # of immediate attempts allowed; rate/window is the refill speed. Account
    # lockout (LOGIN_MAX_FAILED_ATTEMPTS) is the real brute-force defense, so
    # these only need to stop flooding, not legitimate interactive logins.
    buckets:
      - scope: ip
        rate: 30
        window: 15m
        burst: 10
      - scope: email
        field: email
        rate: 15
        window: 15m
        burst: 5

  # Public-facing checkout. burst was 2 with a 5/hour refill — a real
  # customer retrying a failed payment, or two people checking out from the
  # same home/office IP, could get blocked. Fraud/abuse is caught by
  # FraudDetectionService + idempotency, not this — this is just a volume
  # cap, so it can afford to be generous.
  - id: orders
    match:
      methods: [POST]
      paths: [/api/orders, /]
      operations: [order.create, order.initiate, order.verifyPayment]
    buckets:
      - scope: ip
        rate: 30
        window: 1h
        burst: 10
      - scope: email
        field: userEmail
        rate: 10
        window: 1h
        burst: 5

  # "My Orders" lookup (email + phone, no account/auth). Tight cap — this
  # is the one public endpoint that returns another person's order data if
  # both fields are guessed, so it needs to resist brute-forcing far more
  # than a normal form submit.
  - id: orders_lookup
    match:
      methods: [POST]
      paths: [/api/orders/lookup]
    buckets:
      - scope: ip
        rate: 10
        window: 1h
        burst: 5

  # Public contact form. burst was 1 with 1/hour per email — a single
  # legitimate resubmission (typo fix, "did that send?") would get blocked.
  - id: contact
    match:
      methods: [POST]
      paths: [/api/contact, /]
      operations: [contact.create]
    buckets:
      - scope: ip
        rate: 20
        window: 1h
        burst: 5
      - scope: email
        field: email
        rate: 5
        window: 1h
        burst: 2

  # Public newsletter signup. burst was 1 with 3/day per IP — a shared
  # office/campus/cafe IP could only see 3 signups a day total.
  - id: newsletter
    match:
      methods: [POST]
      paths: [/api/newsletter, /]
      operations: [newsletter.subscribe]
    buckets:
      - scope: ip
        rate: 20
        window: 24h
        burst: 5
      - scope: email
        field: email
        rate: 2
        window: 24h
        burst: 1

  # F-14: cap public analytics writes per IP so trackEvent/trackMetric cannot
  # be used to flood/poison dashboards. Validation (allowlists + bounds) lives
  # in src/cqrs/param_models.py; this is the volume control.
  - id: analytics_write
    match:
      methods: [POST]
      paths: [/]
      operations: [analytics.trackEvent, analytics.trackMetric]
    buckets:
      - scope: ip
        rate: 120
        window: 1m
        burst: 30

  - id: product_search
    match:
      methods: [GET]
      paths: [/api/products]
    buckets:
      - scope: ip
        rate: 60
        window: 1m
        burst: 20

  - id: admin_api
    match:
      methods: ["*"]
      paths: [/api/admin/*]
    # The full-site export fetches every section + downloads every asset through
    # the admin API. Burst must cover at least section fetches + asset downloads
    # in one export run, or sites with many photos get throttled mid-export.
    buckets:
      - scope: ip
        rate: 500
        window: 1m
        burst: 200
      - scope: admin
        rate: 500
        window: 1m
        burst: 200

  - id: admin_upload
    match:
      methods: [POST]
      paths: [/api/admin/upload]
    buckets:
      - scope: ip
        rate: 30
        window: 1m
        burst: 10
      - scope: admin
        rate: 20
        window: 1m
        burst: 5

  # Webhooks are already protected at the application layer (HMAC signature
  # for Razorpay, x-api-key for Shiprocket) — rate limiting here is only a
  # volume/DoS backstop, not a security control, so it can be generous enough
  # to never realistically trip on legitimate delivery + retry traffic from
  # either provider's own servers.
  - id: webhook_razorpay
    match:
      methods: [POST]
      paths: [/webhook/razorpay]
    buckets:
      - scope: ip
        rate: 6000
        window: 1m
        burst: 600

  - id: webhook_shiprocket
    match:
      methods: [GET, POST]
      paths: [/webhook/courier-updates]
    buckets:
      - scope: ip
        rate: 6000
        window: 1m
        burst: 600

  - id: public_get
    match:
      methods: [GET]
      paths: ["*"]
    buckets:
      - scope: ip
        rate: 400
        window: 3m
        burst: 400

  - id: public_post_fallback
    match:
      methods: [POST]
      paths: ["*"]
    buckets:
      - scope: ip
        rate: 400
        window: 3m
        burst: 400
