# =====================================================================
# Host nginx for chokmoki — put in /etc/nginx/sites-available/chokmoki
# then: ln -s ../sites-available/chokmoki /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# Fixes:
#   1. SPA refresh 404  -> try_files ... /index.html  (www block)
#   2. API reachability -> reverse proxy to backend :8000 (api block)
# CORS is handled by FastAPI (CORS_ALLOWED_ORIGINS), NOT here — do not
# add CORS headers in nginx or you get duplicate/invalid headers.
# =====================================================================

proxy_cache_path /var/cache/nginx/chokmoki-media levels=1:2 keys_zone=chokmoki_media:50m max_size=2g inactive=30d use_temp_path=off;

# ---- Frontend SPA: www.chokmoki.com --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name chokmoki.com;
    return 301 https://www.chokmoki.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.chokmoki.com;

    # TLS: manage with certbot (certbot --nginx -d www.chokmoki.com -d chokmoki.com)
    # certbot injects the listen 443 / ssl_certificate lines automatically.

    root /var/www/chokmoki;      # <-- put the built `dist/` contents here
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml font/woff2;

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /llms.txt {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=86400";
    }

    # public/products/ is a real media folder. Exact shop URLs must not 403.
    # Serve the prerendered shop page, never the homepage snapshot.
    location = /products {
        try_files /products/index.html /spa-shell.html =404;
    }
    location = /products/ {
        try_files /products/index.html /spa-shell.html =404;
    }

    # Hardcoded https:// scheme (not $scheme) — this block also gets hit
    # over plain :80 if a deploy overwrites the certbot-injected `listen 443
    # ssl` line, and a relative /products redirect would resolve to
    # http://products on that path. Explicit absolute https URL is correct
    # either way.
    location = /shop { return 301 https://www.chokmoki.com/products; }
    location = /shop/ { return 301 https://www.chokmoki.com/products; }
    location = /store { return 301 https://www.chokmoki.com/products; }
    location = /store/ { return 301 https://www.chokmoki.com/products; }

    # Retired archive-catalog product slugs already indexed by Google.
    # Real 301s (not client-side JS redirects) so crawlers update the index.
    location ~ ^/product/(bee-pendant-set|butterfly-ring|wing-ring|love-ring|infinity-couple-ring|endless-love-ring|heart-shaped-earrings|little-bird-earrings|mother-baby-earrings|nature-drop-earrings)/?$ {
        return 301 https://www.chokmoki.com/products;
    }

    # Prerender writes dist/story/index.html etc. `$uri/` matches that directory
    # and 301s to a trailing slash, which React Router does not match.
    rewrite ^/(.*)/$ /$1 permanent;

    location = / {
        try_files /home.html /index.html =404;
    }

    location ^~ /admin {
        try_files /spa-shell.html /index.html =404;
    }

    # Real HTTP 404s for crawlers: only paths under a known React Router
    # route get the SPA shell. Anything else (typo'd/retired URLs) falls
    # through to `location /` below and gets an actual 404 status + the
    # prerendered NotFound snapshot, instead of a soft-404 (200 + index.html).
    location ~ ^/(products|product|category|wishlist|orders|account|checkout|thank-you|blog|history|story|contact|policy|login)(/|$) {
        try_files $uri $uri/index.html /spa-shell.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Fallback is spa-shell.html (empty #root), NOT the prerendered homepage.
    # Use $uri/index.html (not $uri/) so /category/rings stays unslashed.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Never cache the HTML entry.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /spa-shell.html {
        add_header Cache-Control "no-cache";
    }

    location = /home.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets — cache forever.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:avif|webp|png|jpe?g|gif|ico|mp4|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
}

# ---- Backend API: api.chokmoki.com ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.chokmoki.com;

    # certbot --nginx -d api.chokmoki.com  adds the TLS lines here
    # (and normally rewrites this same block to redirect http->https too).
    # After running certbot, verify with: curl -I http://api.chokmoki.com
    # should return a 301 to https — if not, run:
    #   certbot --nginx -d api.chokmoki.com --redirect

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m;   # product image uploads

    location /media/ {
        proxy_cache chokmoki_media;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;   # backend container/uvicorn
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
