# Local-only overrides. NOT used in production (prod deploys don't include this file).
# Keeps backend/worker off host port 8000 (used by another local project) and
# forces ENVIRONMENT=development so admin login skips the password check locally.
services:
  backend:
    ports: !override
      - "8001:8000"
    environment:
      ENVIRONMENT: development

  worker:
    environment:
      ENVIRONMENT: development
