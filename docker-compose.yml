# Single compose file for both production and local docker testing.
# Local: docker compose up --build   (rebuilds the image from your working tree)
# Prod:  docker compose up -d --build
# Both read the same .env — no local Python/Node processes required.
services:
  mongodb:
    image: mongo:7
    container_name: chokmoki-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chokmoki
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chokmoki-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chokmoki-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/chokmoki
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_TIMEOUT: "10"
      # Local-only override: bypasses admin password check (see admin_auth_service.py).
      # Does not touch .env, so production deploys (which don't use this compose override) keep the real password.
      ENVIRONMENT: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
