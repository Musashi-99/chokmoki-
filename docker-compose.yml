# Single compose file for both production and local docker testing.
# Local: docker compose up --build   (rebuilds the image from your working tree)
# Prod:  docker compose up -d --build
# Both read the same .env — no local Python/Node processes required.
services:
  mongodb:
    image: mongo:7
    container_name: chokmoki-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chokmoki
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chokmoki-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chokmoki-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/chokmoki
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_TIMEOUT: "10"
      # Same compose file is used for prod and local (see header comment), so this must
      # NOT hardcode a value: it defaults to production and only becomes "development"
      # if the shell running `docker compose up` explicitly exports ENVIRONMENT=development.
      # Prod deploys never set that var, so .env's ENVIRONMENT=production always wins there.
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
  backend_logs:
