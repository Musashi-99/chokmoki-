# Single compose file for both production and local docker testing.
# Local: docker compose up --build   (rebuilds the image from your working tree)
# Prod:  docker compose up -d --build
# Both read the same .env — no local Python/Node processes required.
services:
  mongodb:
    image: mongo:7
    container_name: chokmoki-mongodb
    restart: unless-stopped
    # Caps so a runaway query/leak in one container can't starve the host or
    # the other services — tune to your box's actual capacity.
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chokmoki
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chokmoki-redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    # Durability: without this, an unclean container stop/crash loses
    # anything since the last RDB snapshot — including in-flight rate-limit
    # counters, idempotency keys, inventory reservations, and (worse) any
    # Redis Stream entries not yet consumed. AOF persists every write.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  geoip:
    # In-house IP -> country lookup (dbip-city-lite DB, auto-downloaded on
    # first start — see geoip-discovery/entrypoint.sh, no license key
    # needed). Only resolves real-world IPs: from localhost/docker the
    # source IP is always private, so this always answers "default" for
    # local dev — use the storefront's country selector (explicit choice)
    # to test AU/NZ pricing locally instead of relying on GeoIP.
    #
    # Deliberately NOT published to the host (no `ports:`) and not proxied
    # by nginx — this is an internal-only service. The one and only
    # client-facing surface for GeoIP is the backend's own
    # GET /api/geo/detect (api/routes/geo.py), which calls this over the
    # compose network at http://geoip:8080. That's what carries the real
    # client IP: nginx sets X-Real-IP on every request to the backend
    # (deploy/nginx-chokmoki.conf), the backend resolves it via
    # extract_client_ip() (src/security/client_ip.py, TRUSTED_PROXY_ENABLED),
    # then hands that IP to GeoIPDiscoveryAdapter — never the browser
    # talking to this container directly.
    #
    # To debug it directly during local dev: `docker compose exec backend
    # curl http://geoip:8080/health` (or `/lookup?ip=8.8.8.8`) — no host
    # port needed.
    build:
      context: ./geoip-discovery
    container_name: chokmoki-geoip
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - geoip_data:/data
    command: ["-addr", ":8080", "-cache-mb", "200"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chokmoki-backend
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/chokmoki
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_TIMEOUT: "10"
      # Same compose file is used for prod and local (see header comment), so this must
      # NOT hardcode a value: it defaults to production and only becomes "development"
      # if the shell running `docker compose up` explicitly exports ENVIRONMENT=development.
      # Prod deploys never set that var, so .env's ENVIRONMENT=production always wins there.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      GEOIP_SERVICE_URL: http://geoip:8080
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      geoip:
        condition: service_healthy

  worker:
    # Same image/Dockerfile as backend — just a different process entrypoint
    # and container, so background stream consumers (Telegram alerts,
    # crash-safe Razorpay payment confirmation) run separately from the
    # request-serving API. An API restart/crash can never drop an in-flight
    # payment confirmation, and vice versa. See src/worker.py.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chokmoki-worker
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["python", "-m", "src.worker"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/chokmoki
      REDIS_URL: redis://redis:6379/0
      REDIS_SOCKET_TIMEOUT: "10"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Distinct filename from backend's app.log — two processes rotating the
      # same file concurrently would corrupt each other's rotation state.
      LOG_FILE_NAME: worker.log
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The Dockerfile's HEALTHCHECK curls an HTTP endpoint — this process
    # isn't an HTTP server at all, so that check would always fail and
    # wrongly report "unhealthy". Instead, check freshness of the heartbeat
    # file src/worker.py's heartbeat_loop touches every 15s — a stopped or
    # wedged event loop stops updating it, which is exactly the silent-death
    # failure mode the worker supervisor (src/worker.py main()) also guards
    # against from the inside.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,time; p='/app/logs/worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<60 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  mongodb_data:
  redis_data:
  backend_logs:
  geoip_data:
